<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой крутой органайзер</title>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary-gray: #e4e6eb;
            --dark-gray: #333333;
            --text-color: #242526;
            --accent-color: #65676b;
            --radius: 16px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            /* Цвета смен */
            --night-shift: #1c3d5a; /* Темно-голубой */
            --day-shift: #b78103;   /* Темно-желтый */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Авторизация */
        #auth-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
            padding: 40px 20px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--primary-gray);
            border-radius: var(--radius);
            background-color: var(--bg-color);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: var(--radius);
            background-color: var(--dark-gray);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .switch-auth {
            background: none;
            color: var(--accent-color);
            border: none;
            cursor: pointer;
        }

        /* Виджеты */
        .hidden { display: none !important; }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .widget {
            background: var(--bg-color);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 15px;
        }

        /* Календарь */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 8px;
        }

        .calendar-nav button {
            padding: 8px 12px;
            font-size: 13px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-day-header {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
            padding-bottom: 5px;
        }

        .calendar-cell {
            aspect-ratio: 1;
            background: var(--card-bg);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            border: 1px solid transparent;
            transition: transform 0.1s;
        }

        .calendar-cell:hover {
            border-color: var(--accent-color);
        }

        .calendar-cell.night {
            background-color: var(--night-shift) !important;
            color: white !important;
        }

        .calendar-cell.day {
            background-color: var(--day-shift) !important;
            color: white !important;
        }

        .calendar-cell.has-note::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 4px;
            height: 4px;
            background-color: #ff4757;
            border-radius: 50%;
        }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ЭКРАН АВТОРИЗАЦИИ -->
        <div id="auth-screen">
            <h2>Вход в твою систему 🥀</h2>
            <div id="auth-error" class="hidden" style="color: #ff4757; font-size: 13px;"></div>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Пароль">
            <button id="auth-btn" onclick="handleAuth()">Войти</button>
            <button class="switch-auth" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН С ВИДЖЕТАМИ -->
        <div id="app-screen" class="hidden">
            <div class="header-top">
                <h3 id="user-greeting" style="margin: 0;">Привет! ✨</h3>
                <button onclick="logout()" style="padding: 6px 12px; font-size: 12px;">Выйти</button>
            </div>

            <!-- Виджет: Календарь со сменами -->
            <div class="widget">
                <div class="calendar-nav">
                    <!-- Кнопка вызова настроек графика смен -->
                    <button onclick="openScheduleModal()" style="background-color: #4b6584;">📅 График</button>
                    <button onclick="changeMonth(-1)">‹ Назад</button>
                    <span id="month-year-label" style="font-weight: 600; font-size: 14px;"></span>
                    <button onclick="changeMonth(1)">Вперед ›</button>
                </div>
                <div class="calendar-grid" id="calendar-days-container"></div>
            </div>

            <!-- Виджет: Счётчик накоплений -->
            <div class="widget">
                <h4 style="margin: 0 0 10px 0;">💰 Копилка</h4>
                <div id="savings-display" style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">0 ₽</div>
                <div style="display: flex; gap: 8px;">
                    <input type="number" id="savings-input" placeholder="Сумма" style="margin:0;">
                    <button onclick="addSavings()">Добавить</button>
                </div>
            </div>

            <!-- Виджет: Задачи -->
            <div class="widget">
                <h4 style="margin: 0 0 10px 0;">📝 Задачи</h4>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="task-input" placeholder="Новая задача..." style="margin:0;">
                    <button onclick="addTask()">Плюс</button>
                </div>
                <div id="tasks-list" style="display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ДЛЯ НАСТРОЙКИ ГРАФИКА СМЕН -->
    <div id="schedule-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin: 0;">Настройка графика смен</h3>
            <label style="font-size: 13px; color: var(--accent-color);">Тип графика:</label>
            <select id="schedule-type">
                <option value="2-2">2/2 (2 дн, 2 вых, 2 ноч...)</option>
                <option value="1-3">День / 3 выходных (1/3)</option>
                <option value="5-2">5/2 (Пн-Пт вых, Сб-Вс работа)</option>
                <option value="3-3">3/3 (3 дн, 3 вых)</option>
                <option value="night-day-2off">День / Ночь / 2 выходных</option>
            </select>

            <label style="font-size: 13px; color: var(--accent-color);">С какого дня начинаем отсчет (сдвиг):</label>
            <input type="date" id="schedule-start-date">

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="applySchedule()" style="flex: 1; background-color: #20bf6b;">Применить</button>
                <button onclick="closeScheduleModal()" style="flex: 1; background-color: #eb4d4b;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ДЛЯ ДНЯ И ПРИМЕЧАНИЯ -->
    <div id="day-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-date-title" style="margin: 0;">Дата</h3>
            <label style="font-size: 13px; color: var(--accent-color);">Статус смены:</label>
            <select id="modal-shift-select">
                <option value="none">Обычный день / Выходной</option>
                <option value="day">Дневная смена (темно-желтая)</option>
                <option value="night">Ночная смена (темно-голубая)</option>
            </select>

            <label style="font-size: 13px; color: var(--accent-color);">Примечание:</label>
            <textarea id="modal-note-input" rows="3" placeholder="Напиши что-нибудь..."></textarea>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="saveDayData()" style="flex: 1; background-color: #20bf6b;">Сохранить</button>
                <button onclick="closeDayModal()" style="flex: 1; background-color: #eb4d4b;">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ТВОИ ДАННЫЕ FIREBASE (Вставь свои ключи при необходимости)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplate-12345",
            authDomain: "my-app.firebaseapp.com",
            projectId: "my-app",
            storageBucket: "my-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcde"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isLoginMode = true;
        let currentUser = null;
        let currentDate = new Date();
        let selectedDateStr = null;
        let userAppData = { shifts: {}, notes: {}, savings: 0, tasks: [] };

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('user-greeting').innerText = `Привет, ${user.email.split('@')[0]}! ✨`;
                loadUserData();
            } else {
                currentUser = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
            }
        });

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.querySelector('.switch-auth').innerText = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('auth-error');
            errDiv.classList.add('hidden');

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    await auth.createUserWithEmailAndPassword(email, password);
                }
            } catch (error) {
                errDiv.innerText = error.message;
                errDiv.classList.remove('hidden');
            }
        }

        function logout() { auth.signOut(); }

        // Работа с Firestore
        async function loadUserData() {
            if (!currentUser) return;
            const docRef = db.collection('users').doc(currentUser.uid);
            const doc = await docRef.get();
            if (doc.exists) {
                userAppData = doc.data();
                if (!userAppData.shifts) userAppData.shifts = {};
                if (!userAppData.notes) userAppData.notes = {};
                if (!userAppData.tasks) userAppData.tasks = [];
            }
            renderCalendar();
            renderSavings();
            renderTasks();
        }

        async function saveUserData() {
            if (!currentUser) return;
            await db.collection('users').doc(currentUser.uid).set(userAppData);
        }

        // Рендер календаря
        function renderCalendar() {
            const container = document.getElementById('calendar-days-container');
            container.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            document.getElementById('month-year-label').innerText = `${monthNames[month]} ${year}`;

            // Дни недели
            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            daysOfWeek.forEach(d => {
                const div = document.createElement('div');
                div.className = 'calendar-day-header';
                div.innerText = d;
                container.appendChild(div);
            });

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Пустые ячейки для смещения начала месяца
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                container.appendChild(emptyDiv);
            }

            // Дни месяца
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';
                
                const monthStr = String(month + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${year}-${monthStr}-${dayStr}`;

                cell.innerText = day;

                // Цвета смен
                if (userAppData.shifts[dateKey] === 'night') {
                    cell.classList.add('night');
                } else if (userAppData.shifts[dateKey] === 'day') {
                    cell.classList.add('day');
                }

                // Индикатор примечания
                if (userAppData.notes[dateKey]) {
                    cell.classList.add('has-note');
                }

                cell.onclick = () => openDayModal(dateKey);
                container.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        // Автогенерация графика на месяц с учетом сдвига
        function openScheduleModal() {
            document.getElementById('schedule-start-date').valueAsDate = new Date();
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function closeScheduleModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        function applySchedule() {
            const type = document.getElementById('schedule-type').value;
            const startDateInput = document.getElementById('schedule-start-date').value;
            if (!startDateInput) return;

            let startDate = new Date(startDateInput);
            
            // Генерируем смены на текущий год и +- пару месяцев вокруг
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const startLimit = new Date(year, month, 1);
            const endLimit = new Date(year, month + 1, 0);

            // Пробегаем весь текущий месяц отображаемый
            for (let d = new Date(startLimit); d <= endLimit; d.setDate(d.getDate() + 1)) {
                const dStr = d.toISOString().split('T')[0];
                const diffTime = d - startDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays >= 0) {
                    let shiftVal = 'none';

                    if (type === '2-2') {
                        // Пример цикла 2/2: 2 дня, 2 выходных, 2 ночи, 2 выходных (упростим под цикл из 8 дней)
                        const rem = diffDays % 8;
                        if (rem === 0 || rem === 1) shiftVal = 'day';
                        if (rem === 4 || rem === 5) shiftVal = 'night';
                    } else if (type === '1-3') {
                        const rem = diffDays % 4;
                        if (rem === 0) shiftVal = 'day';
                    } else if (type === '3-3') {
                        const rem = diffDays % 6;
                        if (rem < 3) shiftVal = 'day';
                    } else if (type === 'night-day-2off') {
                        const rem = diffDays % 4;
                        if (rem === 0) shiftVal = 'night';
                        if (rem === 1) shiftVal = 'day';
                    } else if (type === '5-2') {
                        const dayOfWeek = d.getDay(); // 6=Сб, 0=Вс
                        if (dayOfWeek === 6 || dayOfWeek === 0) shiftVal = 'day';
                    }

                    if (shiftVal !== 'none') {
                        userAppData.shifts[dStr] = shiftVal;
                    } else {
                        delete userAppData.shifts[dStr];
                    }
                }
            }

            saveUserData();
            renderCalendar();
            closeScheduleModal();
        }

        // Модалка дня (смена + примечание)
        function openDayModal(dateKey) {
            selectedDateStr = dateKey;
            document.getElementById('modal-date-title').innerText = `День: ${dateKey}`;
            document.getElementById('modal-shift-select').value = userAppData.shifts[dateKey] || 'none';
            document.getElementById('modal-note-input').value = userAppData.notes[dateKey] || '';
            document.getElementById('day-modal').classList.remove('hidden');
        }

        function closeDayModal() {
            document.getElementById('day-modal').classList.add('hidden');
        }

        function saveDayData() {
            if (!selectedDateStr) return;
            const shiftVal = document.getElementById('modal-shift-select').value;
            const noteVal = document.getElementById('modal-note-input').value;

            if (shiftVal === 'none') {
                delete userAppData.shifts[selectedDateStr];
            } else {
                userAppData.shifts[selectedDateStr] = shiftVal;
            }

            if (!noteVal.trim()) {
                delete userAppData.notes[selectedDateStr];
            } else {
                userAppData.notes[selectedDateStr] = noteVal.trim();
            }

            saveUserData();
            renderCalendar();
            closeDayModal();
        }

        // Копилка
        function renderSavings() {
            document.getElementById('savings-display').innerText = `${userAppData.savings || 0} ₽`;
        }
        function addSavings() {
            const val = Number(document.getElementById('savings-input').value);
            if (!val) return;
            userAppData.savings = (userAppData.savings || 0) + val;
            document.getElementById('savings-input').value = '';
            saveUserData();
            renderSavings();
        }

        // Задачи
        function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            (userAppData.tasks || []).forEach((task, index) => {
                const item = document.createElement('div');
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.background = 'white';
                item.style.padding = '8px 12px';
                item.style.borderRadius = '10px';
                item.style.fontSize = '13px';
                
                item.innerHTML = `<span>${task}</span><button onclick="removeTask(${index})" style="padding: 2px 6px; font-size: 11px; background: #eb4d4b;">✕</button>`;
                list.appendChild(item);
            });
        }
        function addTask() {
            const input = document.getElementById('task-input');
            if (!input.value.trim()) return;
            if (!userAppData.tasks) userAppData.tasks = [];
            userAppData.tasks.push(input.value.trim());
            input.value = '';
            saveUserData();
            renderTasks();
        }
        function removeTask(index) {
            userAppData.tasks.splice(index, 1);
            saveUserData();
            renderTasks();
        }
    </script>
</body>
</html>
